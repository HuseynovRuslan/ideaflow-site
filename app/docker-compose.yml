# IdeaFlow — əsas tərkib. Serverdə bunun yanında docker-compose.override.yml
# (shared-caddy simlinki) dayanır və xidməti Caddy şəbəkəsinə qoşur.
# Port yalnız 127.0.0.1-ə açılır: xaricə çıxış Caddy vasitəsilə olur.
services:
  # Xidmətin adı şəbəkədə alias olur. «app» ümumi addır və bu konteyner QRLog-un
  # paylaşılan şəbəkəsinə də qoşulur — orada ümumi ad növbəti layihə ilə toqquşa bilər
  # (bazada «db» ilə məhz bu oldu). Ona görə ad layihəyə məxsusdur.
  ideaflow-app:
    build: .
    environment:
      TZ: Asia/Baku
      DATA_DIR: /data
      # «db» DEYİL: bu konteyner paylaşılan Caddy şəbəkəsinə də qoşulur və orada QRLog-un bazası
      # məhz «db» adına cavab verir (attendanceqr-db-1 aliases: [attendanceqr-db-1 db]). Ad təkrar
      # olanda Docker DNS hansını qaytaracağına zəmanət vermir — tətbiq başqa layihənin bazasına
      # dəyə bilər. Ona görə baza öz şəbəkəsində unikal adla çağırılır.
      PGHOST: ideaflow-db
      PGPORT: "5432"
      PGDATABASE: ideaflow
      PGUSER: ideaflow
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylında təyin edilməlidir}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL .env faylında təyin edilməlidir}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD .env faylında təyin edilməlidir}
    volumes:
      - ideaflow-files:/data
    ports:
      - "127.0.0.1:8100:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    networks:
      default:
        aliases: [ideaflow-db]
    environment:
      POSTGRES_DB: ideaflow
      POSTGRES_USER: ideaflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylında təyin edilməlidir}
      TZ: Asia/Baku
    volumes:
      - ideaflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideaflow -d ideaflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  ideaflow-db:
  ideaflow-files:
