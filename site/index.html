<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IdeaFlow — məhsul buraxılışı platforması</title>
<style>
  :root{
    --ink:#16202E;--muted:#5C6775;--line:#E5E1DA;--bg:#F6F4F0;--surface:#FFFFFF;--soft:#F1EEE9;
    --accent:#1F5E8C;--accent-2:#0E7C66;
    --author:#1F5E8C;--maker:#C07A2C;--investor:#0E7C66;--seller:#B0396E;--admin:#C0392B;--platform:#42607A;
    --shadow:0 1px 2px rgba(16,32,46,.05),0 10px 26px rgba(16,32,46,.08);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none;cursor:pointer}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:14px}
  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px;transition:.15s;border:1px solid transparent}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(31,94,140,.25)}
  .btn-primary:hover{background:#18496e}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}
  .muted{color:var(--muted)}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:40;height:60px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 22px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:850;font-size:18px;letter-spacing:-.02em}
  .logo .m{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center}
  .spacer{flex:1}
  .roleSel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .roleSel select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:650;color:var(--ink)}
  .bell{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
  .bell .cnt{position:absolute;top:-6px;right:-6px;background:var(--seller);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

  .layout{display:flex;min-height:calc(100vh - 60px)}
  .side{width:210px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px}
  .side .grp{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 8px 6px}
  .side a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px}
  .side a:hover{background:var(--soft)}
  .side a.on{background:color-mix(in srgb,var(--accent) 12%,#fff);color:var(--accent)}
  .side a .i{width:18px;height:18px;flex:none;color:currentColor}
  .content{flex:1;padding:26px 30px;max-width:1000px}
  @media(max-width:820px){.side{display:none}.content{padding:18px}}

  .page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .page-h h1{font-size:26px;font-weight:840;letter-spacing:-.02em}
  .page-h p{color:var(--muted);font-size:14.5px;margin-top:3px}

  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  @media(max-width:760px){.tiles{grid-template-columns:1fr 1fr}}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .tile .v{font-size:26px;font-weight:850;letter-spacing:-.02em}
  .tile .k{font-size:12.5px;color:var(--muted);margin-top:2px}

  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .card h3{font-size:16px;margin-bottom:6px}

  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
  .pcard:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(16,32,46,.12)}
  .pcard .cover{height:96px;display:grid;place-items:center;font-size:40px}
  .pcard .pb{padding:14px 16px}
  .pcard h4{font-size:16px;margin-bottom:4px}
  .pcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .pcard .foot{display:flex;align-items:center;justify-content:space-between}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:750;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .rating{font-size:13px;font-weight:800}
  .rating .s{color:var(--gold,#C9A227)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chipf{font-size:13px;font-weight:650;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted)}
  .chipf.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* forms */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .field textarea{min-height:90px;resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}

  /* project card */
  .phead{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
  .phead .ic{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:32px;flex:none}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
  .tabs button{padding:10px 14px;font-size:13.5px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv:last-child{border-bottom:none}
  .kv b{font-weight:750}
  .bar{display:flex;height:40px;border-radius:9px;overflow:hidden;border:1px solid var(--line);margin:10px 0}
  .seg{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;border-right:2px solid #fff}
  .seg:last-child{border-right:none}
  .offer{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .offer:last-child{border-bottom:none}
  .empty{text-align:center;color:var(--muted);padding:30px;font-size:14px}

  /* landing */
  .hero{background:radial-gradient(1000px 500px at 82% -10%,rgba(14,124,102,.20),transparent 55%),linear-gradient(160deg,#0E2438,#12506B);color:#EAF1F6;text-align:center;padding:80px 24px 70px}
  .hero h1{font-size:clamp(34px,6vw,58px);font-weight:880;letter-spacing:-.03em;max-width:15ch;margin:16px auto 16px;line-height:1.04}
  .hero h1 .g{background:linear-gradient(100deg,#7FD9C4,#CFE7F5);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{font-size:19px;color:#C7D5E0;max-width:560px;margin:0 auto 30px}
  .hero .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:#DCE8F0;font-size:13px;font-weight:650;padding:8px 15px;border-radius:999px}
  .enter{max-width:900px;margin:-40px auto 0;padding:0 24px 60px}
  .enterCard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px;text-align:center}
  .roles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
  @media(max-width:760px){.roles{grid-template-columns:1fr 1fr}}
  .rbtn{border:1px solid var(--line);border-radius:14px;padding:18px 14px;background:#fff;text-align:center;transition:.15s}
  .rbtn:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--c)}
  .rbtn .ic{width:46px;height:46px;border-radius:13px;background:var(--c);color:#fff;display:grid;place-items:center;margin:0 auto 10px;font-size:20px}
  .rbtn h4{font-size:15px;margin-bottom:3px}
  .rbtn p{font-size:12px;color:var(--muted)}

  /* toast */
  .toasts{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:10px}
  .toast{background:#16202E;color:#fff;padding:12px 16px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .2s;max-width:320px}
  .toast.ok{background:#0E7C66}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .foot-note{font-size:12px;color:var(--muted);margin-top:20px;text-align:center}

  /* dark theme */
  [data-theme=dark]{--ink:#E7ECF1;--muted:#9BA6B2;--line:#2A3542;--bg:#0F1621;--surface:#17212E;--soft:#1E2A38;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.45)}
  [data-theme=dark] .topbar{background:rgba(23,33,46,.92)}
  [data-theme=dark] .btn-ghost,[data-theme=dark] .chipf,[data-theme=dark] .roleSel select,[data-theme=dark] .field input,[data-theme=dark] .field select,[data-theme=dark] .field textarea,[data-theme=dark] .searchbar input,[data-theme=dark] .chatin input{background:#0F1621;color:var(--ink)}
  .ticon{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px}
  /* status timeline */
  .timeline{display:flex;margin:6px 0 4px}
  .tl{flex:1;min-width:66px;text-align:center;position:relative;padding-top:22px}
  .tl:before{content:"";position:absolute;top:8px;left:0;right:0;height:2px;background:var(--line)}
  .tl:first-child:before{left:50%}.tl:last-child:before{right:50%}
  .tl .d{position:absolute;top:1px;left:50%;transform:translateX(-50%);width:15px;height:15px;border-radius:50%;background:var(--surface);border:3px solid var(--line);z-index:1}
  .tl.done .d{border-color:var(--accent-2);background:var(--accent-2)}
  .tl.cur .d{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
  .tl span{font-size:10.5px;color:var(--muted)}
  .tl.cur span{color:var(--accent);font-weight:800}
  /* notif dropdown */
  .ndrop{position:absolute;top:54px;right:14px;width:300px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:60;overflow:hidden}
  .ndrop .nh{padding:12px 14px;font-weight:800;font-size:13px;border-bottom:1px solid var(--line)}
  .ndrop .ni{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--line)}
  .ndrop .ni:last-child{border-bottom:none}
  .ndrop .ni .tm{color:var(--muted);font-size:11px;margin-top:2px}
  /* docs + chat */
  .doc{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .doc:last-child{border-bottom:none}
  .doc .dt{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:6px;color:#fff}
  .doc .nm{flex:1;font-size:14px}
  .chatbox{display:flex;flex-direction:column;gap:9px;max-height:300px;overflow:auto;margin-bottom:12px;padding:4px}
  .msg{max-width:78%;padding:9px 13px;border-radius:13px;font-size:13.5px;line-height:1.4}
  .msg.them{background:var(--soft);align-self:flex-start;border-bottom-left-radius:3px}
  .msg.me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
  .msg .who{font-size:11px;font-weight:700;opacity:.75;margin-bottom:2px}
  .chatin{display:flex;gap:8px}
  .chatin input{flex:1;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
  .searchbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .searchbar input{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
  /* charts */
  .chartrow{display:flex;align-items:center;gap:12px;margin:8px 0}
  .chartrow .cl{width:150px;font-size:13px;flex:none}
  .chartrow .ct{flex:1;height:22px;background:var(--soft);border-radius:7px;overflow:hidden}
  .chartrow .cf{height:100%;border-radius:7px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:800;min-width:32px}
  /* onboarding tour */
  .overlay{position:fixed;inset:0;background:rgba(10,20,30,.55);z-index:200;display:grid;place-items:center;padding:20px}
  .tourcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;max-width:440px;width:100%;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.45);text-align:center}
  .tourcard .em{font-size:38px}
  .tourcard h3{font-size:21px;margin:12px 0 8px}
  .tourcard p{color:var(--muted);font-size:14.5px;line-height:1.55}
  .tourcard .dots{display:flex;gap:6px;margin:20px auto;justify-content:center}
  .tourcard .dots span{width:8px;height:8px;border-radius:50%;background:var(--line);transition:.2s}
  .tourcard .dots span.on{background:var(--accent);width:22px;border-radius:4px}
  .tourcard .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
</style>
</head>

/* ---------------- ROUTER ---------------- */
window.addEventListener('hashchange',render);
window.addEventListener('load',render);
function render(){
  document.documentElement.lang=S.lang;
  document.title=t('appTitle');
  const h=location.hash||'#/';
  if(h==='#/'||h===''){ $('#app').innerHTML=landing(); return; }
  const m=h.match(/^#\/project\/(\d+)/);
  if(m){ shell(projectView(P(m[1]))); return; }
  if(h.startsWith('#/projects')){ shell(projectsView()); return; }
  if(h.startsWith('#/new')){ shell(newView()); return; }
  if(h.startsWith('#/makers')){ shell(makersView()); return; }
  if(h.startsWith('#/investors')){ shell(investorsView()); return; }
  if(h.startsWith('#/pricing')){ shell(pricingView()); return; }
  if(h.startsWith('#/analytics')){ shell(analyticsView()); return; }
  if(h.startsWith('#/app')){ shell(dashboardView()); return; }
  $('#app').innerHTML=landing();
}

      ${p.status!=='prod'&&p.status!=='sales'?`<button class="btn btn-primary btn-sm" style="margin-top:14px" onclick="signDeal(${p.id})">${t('dl_sign')}</button>`:`<p class="muted" style="font-size:13px;margin-top:12px">${t('dl_signed')}</p>`}
      `:`<div class="empty">${t('dl_need')}</div>`}
    </div>`;
  }
  if(tb==='docs'){
    const docs=defaultDocs(p);
    return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3>${t('dc_title')}</h3><button class="btn btn-ghost btn-sm" onclick="toast(t('ts_docUp'))">${t('dc_upload')}</button></div>
      ${docs.map(d=>`<div class="doc"><span class="dt" style="background:${DOCTYPES[d.t]||'#888'}">${t('dt_'+d.t)}</span><span class="nm">${t(d.k)}</span><a class="muted" style="font-size:13px" onclick="toast(t('ts_docOpen'))">${t('dc_open')}</a></div>`).join('')}
      <p class="muted" style="font-size:12.5px;margin-top:12px">${t('dc_note')}</p>
    </div>`;
  }
  if(tb==='chat'){
    const ms=defaultMsgs(p);
    return `<div class="card"><h3 style="margin-bottom:12px">${t('ch_title')}</h3>
      <div class="chatbox">${ms.map(m=>`<div class="msg ${m.me?'me':'them'}"><div class="who">${esc(msgWho(m))}</div>${m.textK?t(m.textK):esc(m.text)}</div>`).join('')}</div>
      <div class="chatin"><input id="msgin" placeholder="${t('ch_ph')}" onkeydown="if(event.key==='Enter')sendMsg(${p.id})"><button class="btn btn-primary btn-sm" onclick="sendMsg(${p.id})">${t('ch_send')}</button></div>
    </div>`;
  }
}
function msgWho(m){
  if(m.roleK) return t('ch_you')+' ('+rl(m.roleK)+')';
  if(m.whoK) return t(m.whoK);
  return tv(m.who);
}
function timeline(p){
  const order=['assess','demand','findmaker','findinv','deal','prod','sales'];
  const cur=order.indexOf(p.status);
  return `<div class="timeline">${order.map((s,i)=>`<div class="tl ${i<cur?'done':''} ${i===cur?'cur':''}"><span class="d"></span><span>${t('tl_'+s)}</span></div>`).join('')}</div>`;
}

/* ---------------- ACTIONS ---------------- */
function runAI(id){const p=P(id);p.rating=70+((id*7)%25);p.market=MARKETS[id%4];p.cost='$'+(6+id%9);p.moq=['500','1000','2000'][id%3];toast(t('ts_ai')+p.rating);render();}
function toDemand(id){P(id).status='demand';toast(t('ts_demand'));render();}
function sendOffer(id){const p=P(id);const pr=$('#of_price').value||'$—',mq=$('#of_moq').value||'—',dy=$('#of_days').value||'—';p.offers.push({makerK:'pr_yourFactory',price:pr,moq:mq,days:dy,trust:85});if(p.status==='demand'||p.status==='findmaker')p.status='findmaker';toast(t('ts_offer'));render();}
function acceptOffer(id){const p=P(id);p.status='findinv';toast(t('ts_accept'));render();}
function invest(id){const p=P(id);const a=$('#in_amt').value||'$50 000',tk=$('#in_type').value;p.investments.push({investorK:'iv_you',amount:a,typeK:tk});p.status='deal';toast(t('ts_invest'));S.tab='deal';render();}
function signDeal(id){const p=P(id);p.status='prod';toast(t('ts_signed'));setTimeout(()=>{p.status='sales';toast(t('ts_batch'));render();},1200);render();}
function createProject(){
  const title=$('#np_title').value.trim();if(!title){toast(t('n_needName'),false);return;}
  const p={id:S.nextId++,title:title,cat:$('#np_cat').value,emoji:'✨',authorK:'n_youAuthor',status:'assess',rating:0,market:'—',cost:'—',price:$('#np_price').value||'$—',moq:'—',royalty:8,demand:0,offers:[],investments:[]};
  S.projects.unshift(p);toast(t('ts_created'));S.tab='ai';go('#/project/'+p.id);
}
function toggleTheme(){S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme==='dark'?'dark':'';S.showN=false;render();}
function toggleNotifs(){S.showN=!S.showN;if(S.showN)S.notifs=0;render();}
function catalogItems(){
  let l=S.filterCat==='all'?S.projects:S.projects.filter(p=>p.cat===S.filterCat);
  const q=(S.search||'').trim().toLowerCase();
  if(q)l=l.filter(p=>tv(p.title).toLowerCase().includes(q)||(authorName(p)||'').toLowerCase().includes(q));
  return l.length?l.map(pcard).join(''):`<div class="empty">${t('c_empty')}</div>`;
}
function sendMsg(id){const p=P(id);const el=document.getElementById('msgin');const v=(el.value||'').trim();if(!v)return;defaultMsgs(p);p.messages.push({roleK:S.role,me:true,text:v});render();const b=document.querySelector('.chatbox');if(b)b.scrollTop=b.scrollHeight;}

function tourOverlay(){
  const i=Math.min(S.tour-1,TOUR.length-1);const s=TOUR[i];const last=S.tour>=TOUR.length;
  return `<div class="overlay" onclick="if(event.target===this)skipTour()"><div class="tourcard">
    <div class="em">${s.em}</div><h3>${tv(s.title)}</h3><p>${tv(s.text)}</p>
    <div class="dots">${TOUR.map((_,k)=>`<span class="${k===i?'on':''}"></span>`).join('')}</div>
    <div class="row"><button class="btn btn-ghost btn-sm" onclick="skipTour()">${t('b_skip')}</button>
      <button class="btn btn-primary btn-sm" onclick="nextTour()">${last?t('b_done'):t('b_next')}</button></div>
  </div></div>`;
}
function startTour(){S.tour=1;S.showN=false;render();}
function nextTour(){if(S.tour>=TOUR.length){S.tour=0;S.onboarded=true;}else S.tour++;render();}
function skipTour(){S.tour=0;S.onboarded=true;render();}
function lineChart(labels,data){
  const W=640,H=210,pl=34,pr=14,pt=16,pb=28;
  const max=Math.max(...data)*1.15, iw=W-pl-pr, ih=H-pt-pb;
  const x=i=>pl+(iw*i/(labels.length-1)), y=v=>pt+ih-(v/max*ih);
  const pts=data.map((v,i)=>[x(i),y(v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`M${x(0).toFixed(1)} ${(pt+ih).toFixed(1)} `+pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${x(labels.length-1).toFixed(1)} ${(pt+ih).toFixed(1)} Z`;
  const grid=[0,.5,1].map(f=>{const yy=(pt+ih-f*ih).toFixed(1);return `<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="6" y="${(+yy+4)}" font-size="10" fill="var(--muted)">${Math.round(max*f)}</text>`;}).join('');
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="${p[0].toFixed(1)}" y="${(p[1]-10).toFixed(1)}" font-size="10.5" font-weight="700" fill="var(--ink)" text-anchor="middle">${data[i]}</text>`).join('');
  const xl=labels.map((l,i)=>`<text x="${x(i).toFixed(1)}" y="${H-8}" font-size="10.5" fill="var(--muted)" text-anchor="middle">${l}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:8px">${grid}<path d="${area}" fill="var(--accent)" opacity=".10"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${xl}</svg>`;
}
